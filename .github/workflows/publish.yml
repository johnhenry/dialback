name: Publish to npm

on:
  # Single publish trigger: the version tag. `gh release create` and the
  # GitHub UI both create this tag, so every release still publishes, and so
  # does a plain `git tag vX.Y.Z && git push --tags`. The `release: published`
  # event is deliberately NOT used: johnhenry/workflows' README documents a
  # real case (fileable v0.0.2, 2026-09-22) where that event was silently
  # dropped for a job whose body is `uses: <external-repo>/...@v1`. The tag
  # push has no such race, so one trigger is enough.
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Queue, never cancel, publish runs for the same ref (a re-pushed tag or a
# manual dispatch while a run is in flight): the reusable workflow's
# `npm view` pre-flight makes a queued second run a clean no-op.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # required by the reusable workflow's provenance step --
        # see johnhenry/workflows' README for why this must be declared here too.
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      gate-commands: |
        npm run test:node
        npm run test:browsermesh
        npm run test:exports
        npm run test:int
    secrets: inherit
