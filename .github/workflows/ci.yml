name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-node:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest", "windows-latest"]'
      gate-commands: |
        npm run test:node
        npm run test:browsermesh
        npm run test:int

  # Deno isn't expressible through the reusable ci.yml (it only sets up a
  # Node/OS matrix), so this leg stays a native job alongside the reusable
  # test-node job above.
  test-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:deno
